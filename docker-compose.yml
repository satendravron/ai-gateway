services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-provider-a:
    build:
      context: .
      dockerfile: apps/mock-providers/Dockerfile
    environment:
      PORT: 3001
      NAME: provider-a
      BASE_LATENCY_MS: 120
      JITTER_MS: 30
      ERROR_RATE: 0.01
    ports:
      - "3001:3001"

  mock-provider-b:
    build:
      context: .
      dockerfile: apps/mock-providers/Dockerfile
    environment:
      PORT: 3002
      NAME: provider-b
      BASE_LATENCY_MS: 200
      JITTER_MS: 50
      ERROR_RATE: 0.02
    ports:
      - "3002:3002"

  mock-provider-c:
    build:
      context: .
      dockerfile: apps/mock-providers/Dockerfile
    environment:
      PORT: 3003
      NAME: provider-c
      BASE_LATENCY_MS: 350
      JITTER_MS: 80
      ERROR_RATE: 0.05
    ports:
      - "3003:3003"

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://gateway:gateway@postgres:5432/gateway
      GATEWAY_PORT: 4000
      API_KEY_SALT: change-me-in-production
      MOCK_A_URL: http://mock-provider-a:3001
      MOCK_B_URL: http://mock-provider-b:3002
      MOCK_C_URL: http://mock-provider-c:3003
    ports:
      - "4000:4000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mock-provider-a:
        condition: service_started
      mock-provider-b:
        condition: service_started
      mock-provider-c:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://gateway:gateway@postgres:5432/gateway
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://gateway:gateway@postgres:5432/gateway
      API_PORT: 4001
    ports:
      - "4001:4001"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        VITE_WS_URL: ws://localhost:4001/ws
        VITE_API_URL: http://localhost:4001
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  redis_data:
  pg_data:
